name = "panyu-campus-ai"
main = "worker/index.mjs"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
AI_BASE_URL = "https://zhenze-huhehaote.cmecloud.cn/v1"
AI_MODEL = "deepseek-v4-flash-0731"
ALLOWED_ORIGINS = "https://campus.sonh.me,https://sonh66.github.io"

[[ratelimits]]
name = "AI_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 6, period = 60 }

[[ratelimits]]
name = "GLOBAL_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 30, period = 60 }
